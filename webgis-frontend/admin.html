<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AirHCM – Quản trị Hệ thống DSS</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="assets/img/Logo AirHCM.png">
</head>
<body>
    <div id="loading"></div>

    <div id="gate" class="overlay">
        <form id="login" class="modal" style="opacity: 1; visibility: visible; transform: translate(-50%, -50%);">
            <h3>Đăng nhập Quản trị</h3>
            <p>Truy cập bảng điều khiển DSS và cấu hình hệ thống ETL.</p>
            <input type="password" id="pw" placeholder="Nhập mật khẩu quản trị" class="input-full" autocomplete="current-password" required>
            <button class="btn btn-full" type="submit">Xác thực</button>
            <div id="gate-err" style="color: red; margin-top: 10px; font-size: 13px;"></div>
        </form>
    </div>

    <header>
        <div class="brand"><h1>AirHCM <small>DSS Dashboard & Admin</small></h1></div>
        <div class="navbar">
            <a class="btn ghost" href="index.html">Giao diện người dùng</a>
            <button class="btn ghost" id="logout">Đăng xuất</button>
        </div>
    </header>

    <section class="kpis" id="kpis" style="display: flex; gap: 16px; padding: 16px 24px; background: #fff; border-bottom: 1px solid var(--line);"></section>

    <main>
        <div id="map"></div>
        <div class="ctl">
            <label><input type="checkbox" id="l-heat" checked> Bản đồ nhiệt</label>
            <label><input type="checkbox" id="l-pts" checked> Điểm dự báo</label>
        </div>
        <div class="legend" id="legend"></div>

          <section id="bottom">
            <div class="tl">
            <button class="btn-play" id="btn-play" title="Tự động phát dự báo 7 ngày">▶</button>
            <b id="t-label" style="min-width: 140px;">Hôm nay</b>
            
            <!-- Sửa max=7 (7 ngày) thay vì 72 -->
            <input type="range" id="slider" min="0" max="7" value="0" aria-label="Thời điểm dự báo (ngày)">
            
            <span>+7 ngày</span> <!-- Sửa nhãn -->
            <button class="btn ghost btn-sm" id="btn-export" style="margin-left: auto;">⬇ Tải CSV</button>
            </div>
            <div class="chart"><canvas id="chart"></canvas></div>
          </section>

        <aside id="panel" class="admin-panel">
            <div id="err" hidden></div>
            
            <h2>Dữ liệu & Mô hình AI</h2>
            <dl id="status" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; margin-bottom: 12px;"></dl>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn" id="etl" style="flex: 1;">Chạy tiến trình ETL</button>
                <button class="btn ghost" id="csv">Xuất SQL/CSV</button>
            </div>
            
            <!-- UI Tiến trình ETL -->
            <div class="progress-container" id="etl-container"><div class="progress-bar" id="etl-bar"></div></div>
            <div class="etl-log" id="etl-log"></div>

            <h2>Top 10 Điểm nóng (Ô nhiễm nhất)</h2>
            <table class="admin-table" id="hot"></table>

            <h2>Quản lý Đăng ký Cảnh báo (Users)</h2>
            <table class="admin-table" id="users">
                <thead><tr><th>Email</th><th>Nhóm đối tượng</th><th>Trạng thái</th><th>Hành động</th></tr></thead>
                <tbody id="users-body"></tbody>
            </table>
        </aside>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
